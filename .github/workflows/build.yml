name: Сборка APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Сборка
        run: |
          chmod +x ./gradlew
          ./gradlew assembleCommunityRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Переименование APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/community/release/*.apk dist/Galereya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: galereya-apk
          path: dist/Galereya.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Галерея (сборка ${{ github.run_number }})
          body: "Сборка из коммита ${{ github.sha }}. Скачайте Galereya.apk ниже и установите."
          make_latest: true
          files: dist/Galereya.apk
